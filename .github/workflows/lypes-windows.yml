name: Buzz LYPES Windows

# Every published LYPES integration change produces a Windows 11 installer.
# The package is intentionally separate from official Buzz: it uses the LYPES
# product name, identifier, deep-link scheme, and has the updater disabled.
on:
  push:
    branches:
      - lypes/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lypes-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows 11 x64 installer
    if: github.repository == 'LYPES-Agency/buzz'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: lypes-windows-release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install locked dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Derive LYPES package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-lypes.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Buzz LYPES $VERSION from $GITHUB_SHA"

      - name: Patch package version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Build release sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Windows installer
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.lypes.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Stage installer and checksum
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle/nsis"
          SOURCE_EXE=$(find "$BUNDLE_DIR" -name '*.exe' -type f | head -1)
          if [[ -z "$SOURCE_EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR"
            exit 1
          fi

          OUTPUT_DIR="$RUNNER_TEMP/buzz-lypes-windows"
          mkdir -p "$OUTPUT_DIR"
          INSTALLER="$OUTPUT_DIR/Buzz-LYPES-${VERSION}-Windows-11-x64.exe"
          cp "$SOURCE_EXE" "$INSTALLER"
          cd "$OUTPUT_DIR"
          sha256sum "$(basename "$INSTALLER")" > "$(basename "$INSTALLER").sha256"

          echo "directory=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "installer_name=$(basename "$INSTALLER")" >> "$GITHUB_OUTPUT"
          {
            echo "### Buzz LYPES for Windows 11"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Installer: \`$(basename "$INSTALLER")\`"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Signing: unsigned"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-lypes-windows-11-x64-${{ steps.version.outputs.version }}
          path: ${{ steps.artifact.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Save pnpm store cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
